type Query {
  health: String! @aws_api_key
  ping(message: String!): String! @aws_cognito_user_pools
  listAwsAccounts: [AwsAccountLink!]! @aws_cognito_user_pools
  listAudits(auditId: ID, limit: Int): [AuditJob!]! @aws_cognito_user_pools
  listAuditFindings(auditId: ID!, domain: String): [AuditFinding!]! @aws_cognito_user_pools
  getAuditReport(auditId: ID!): AuditReport @aws_cognito_user_pools
  getAccountInventory(accountId: String!): AccountInventory! @aws_cognito_user_pools
  listAuditInventory(auditId: ID!): AccountInventory @aws_cognito_user_pools
  getTopologySnapshot(accountId: String!, auditId: ID): TopologySnapshot
    @aws_cognito_user_pools
  listAlertChannels: [AlertChannel!]! @aws_cognito_user_pools
}

type Mutation {
  startAudit(input: StartAuditInput!): StartAuditResult! @aws_cognito_user_pools
  linkAwsAccount(input: LinkAwsAccountInput!): LinkAwsAccountResult! @aws_cognito_user_pools
  verifyAwsAccountLink(input: VerifyAwsAccountLinkInput!): VerifyAwsAccountLinkResult!
    @aws_cognito_user_pools
  publishAuditStatusChanged(input: AuditStatusChangedInput!): AuditStatusChanged!
    @aws_api_key
  upsertAlertChannel(input: UpsertAlertChannelInput!): AlertChannel! @aws_cognito_user_pools
  deleteAlertChannel(channelId: ID!): Boolean! @aws_cognito_user_pools
}

type Subscription {
  onAuditStatusChanged(tenantId: ID!, auditId: ID): AuditStatusChanged
    @aws_subscribe(mutations: ["publishAuditStatusChanged"])
    @aws_cognito_user_pools
}

input StartAuditInput {
  accountId: String!
  regions: [String!]
}

type StartAuditResult @aws_cognito_user_pools {
  accepted: Boolean!
  auditId: ID!
  correlationId: ID!
  executionArn: String!
  tenantId: ID!
  accountId: String!
}

type AuditJob @aws_cognito_user_pools {
  tenantId: ID!
  auditId: ID!
  accountId: String!
  status: String!
  correlationId: ID!
  createdAtIso: AWSDateTime!
  completedAtIso: AWSDateTime
  findingCount: Int!
  criticalCount: Int!
  highCount: Int!
  estimatedMonthlySavingsUsd: Float!
  globalScore: Float!
  pillarScores: WafPillarScores!
  executionArn: String
  errorMessage: String
}

type WafPillarScores @aws_cognito_user_pools {
  operationalExcellence: Float!
  security: Float!
  reliability: Float!
  performanceEfficiency: Float!
  costOptimization: Float!
  sustainability: Float!
}

type AuditFinding @aws_cognito_user_pools {
  tenantId: ID!
  auditId: ID!
  findingId: ID!
  domain: String!
  category: String!
  severity: String!
  resourceArn: String!
  resourceId: String!
  region: String!
  title: String!
  rationale: String!
  recommendedAction: String!
  estimatedMonthlySavingsUsd: Float!
  checkId: String
  friendlyHeadline: String
  friendlyWhy: String
  friendlyAction: String
  friendlyArea: String
  createdAtIso: AWSDateTime!
}

type InventorySummary @aws_cognito_user_pools {
  totalCount: Int!
  ec2Count: Int!
  ebsCount: Int!
  eipCount: Int!
  runningEc2Count: Int!
  stoppedEc2Count: Int!
  unattachedEbsCount: Int!
  idleEipCount: Int!
}

type InventoryResource @aws_cognito_user_pools {
  resourceType: String!
  resourceId: String!
  resourceArn: String!
  region: String!
  state: String!
  detail: String!
  estimatedMonthlyCostUsd: Float!
}

type AccountInventory @aws_cognito_user_pools {
  accountId: String!
  capturedAtIso: AWSDateTime!
  source: String!
  auditId: ID
  summary: InventorySummary!
  resources: [InventoryResource!]!
}

type TopologySummary @aws_cognito_user_pools {
  nodeCount: Int!
  edgeCount: Int!
  serverlessCount: Int!
  nonServerlessCount: Int!
  criticalNodeCount: Int!
}

type TopologyNodeMeta @aws_cognito_user_pools {
  findingIds: [ID!]
}

type TopologyNode @aws_cognito_user_pools {
  id: ID!
  label: String!
  resourceType: String!
  computeClass: String!
  region: String!
  state: String!
  health: String!
  estimatedMonthlyCostUsd: Float!
  meta: TopologyNodeMeta
}

type TopologyEdge @aws_cognito_user_pools {
  id: ID!
  source: ID!
  target: ID!
  kind: String!
  label: String
  bidirectional: Boolean
}

type TopologySnapshot @aws_cognito_user_pools {
  tenantId: ID!
  accountId: String!
  auditId: ID!
  asOfIso: AWSDateTime!
  capturedAtIso: AWSDateTime!
  source: String!
  summary: TopologySummary!
  nodes: [TopologyNode!]!
  edges: [TopologyEdge!]!
}

type AuditReport @aws_cognito_user_pools {
  tenantId: ID!
  auditId: ID!
  reportId: ID!
  accountId: String!
  markdownBody: String!
  aiGenerated: Boolean!
  inventorySummary: InventorySummary
  s3Key: String!
  createdAtIso: AWSDateTime!
  globalScore: Float!
  estimatedMonthlySavingsUsd: Float!
  findingCount: Int!
  criticalCount: Int!
  highCount: Int!
}

input LinkAwsAccountInput {
  accountId: String!
  displayName: String
  roleName: String
  regions: [String!]
}

type LinkAwsAccountResult @aws_cognito_user_pools {
  accountId: String!
  displayName: String!
  roleArn: String!
  externalId: String!
  roleName: String!
  regions: [String!]!
  status: String!
  cloudFormationUrl: String!
  scannerAccountId: String!
  scannerRoleArn: String!
}

input VerifyAwsAccountLinkInput {
  accountId: String!
}

type VerifyAwsAccountLinkResult @aws_cognito_user_pools {
  accountId: String!
  status: String!
  verifiedAtIso: AWSDateTime!
}

type AwsAccountLink @aws_cognito_user_pools {
  accountId: String!
  displayName: String!
  roleArn: String!
  externalId: String!
  regions: [String!]!
  status: String!
  linkedAtIso: AWSDateTime!
  verifiedAtIso: AWSDateTime
}

input AuditStatusChangedInput {
  tenantId: ID!
  auditId: ID!
  accountId: String!
  status: String!
  findingCount: Int!
  criticalCount: Int!
  highCount: Int!
  globalScore: Float!
  estimatedMonthlySavingsUsd: Float!
}

type AuditStatusChanged @aws_api_key @aws_cognito_user_pools {
  tenantId: ID!
  auditId: ID!
  accountId: String!
  status: String!
  findingCount: Int!
  criticalCount: Int!
  highCount: Int!
  globalScore: Float!
  estimatedMonthlySavingsUsd: Float!
}

