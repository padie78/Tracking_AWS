  channelId: ID
  kind: String!
  target: String!
  label: String
  categories: [String!]
}

type AlertChannel @aws_cognito_user_pools {
  channelId: ID!
  kind: String!
  target: String!
  label: String!
  categories: [String!]!
  enabled: Boolean!
  createdAtIso: AWSDateTime
}
