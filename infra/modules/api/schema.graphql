type Query {
  health: String! @aws_api_key
  ping(message: String!): String! @aws_cognito_user_pools
  listFindingsByScan(scanId: ID!): [Finding!]! @aws_cognito_user_pools
  getSavingsDossier(dossierId: ID, scanId: ID): SavingsDossier @aws_cognito_user_pools
  listAwsAccounts: [AwsAccountLink!]! @aws_cognito_user_pools
  listAudits(auditId: ID, limit: Int): [AuditJob!]! @aws_cognito_user_pools
  listAuditFindings(auditId: ID!, domain: String): [AuditFinding!]! @aws_cognito_user_pools
  getAuditReport(auditId: ID!): AuditReport @aws_cognito_user_pools
  getAccountInventory(accountId: String!): AccountInventory! @aws_cognito_user_pools
  listAuditInventory(auditId: ID!): AccountInventory @aws_cognito_user_pools
  listAlertChannels: [AlertChannel!]! @aws_cognito_user_pools
}

type Mutation {
  startAudit(input: StartAuditInput!): StartAuditResult! @aws_cognito_user_pools
  startScan(input: StartScanInput!): StartScanResult! @aws_cognito_user_pools
  linkAwsAccount(input: LinkAwsAccountInput!): LinkAwsAccountResult! @aws_cognito_user_pools
  verifyAwsAccountLink(input: VerifyAwsAccountLinkInput!): VerifyAwsAccountLinkResult!
    @aws_cognito_user_pools
  generateSavingsDossier(input: GenerateSavingsDossierInput!): SavingsDossier
    @aws_cognito_user_pools
  publishScanStatusChanged(input: ScanStatusChangedInput!): ScanStatusChanged! @aws_api_key
  publishFindingReady(input: FindingReadyInput!): FindingReady! @aws_api_key
  publishDossierReady(input: DossierReadyInput!): DossierReady! @aws_api_key
  publishAuditStatusChanged(input: AuditStatusChangedInput!): AuditStatusChanged!
    @aws_api_key
  upsertAlertChannel(input: UpsertAlertChannelInput!): AlertChannel! @aws_cognito_user_pools
  deleteAlertChannel(channelId: ID!): Boolean! @aws_cognito_user_pools
}

type Subscription {
  onScanStatusChanged(tenantId: ID!, scanId: ID): ScanStatusChanged
    @aws_subscribe(mutations: ["publishScanStatusChanged"])
    @aws_cognito_user_pools
  onFindingReady(tenantId: ID!, scanId: ID): FindingReady
    @aws_subscribe(mutations: ["publishFindingReady"])
    @aws_cognito_user_pools
  onDossierReady(tenantId: ID!, scanId: ID): DossierReady
    @aws_subscribe(mutations: ["publishDossierReady"])
    @aws_cognito_user_pools
  onAuditStatusChanged(tenantId: ID!, auditId: ID): AuditStatusChanged
    @aws_subscribe(mutations: ["publishAuditStatusChanged"])
    @aws_cognito_user_pools
}

input StartAuditInput {
  accountId: String!
  regions: [String!]
}

type StartAuditResult @aws_cognito_user_pools {
  accepted: Boolean!
  auditId: ID!
  correlationId: ID!
  executionArn: String!
  tenantId: ID!
  accountId: String!
}

type AuditJob @aws_cognito_user_pools {
  tenantId: ID!
  auditId: ID!
  accountId: String!
  status: String!
  correlationId: ID!
  createdAtIso: AWSDateTime!
  completedAtIso: AWSDateTime
  findingCount: Int!
  criticalCount: Int!
  highCount: Int!
  estimatedMonthlySavingsUsd: Float!
  globalScore: Float!
  pillarScores: WafPillarScores!
